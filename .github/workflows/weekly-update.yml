name: Weekly Price Update

on:
  schedule:
    # 00:00 UTC every Sunday = 8:00 AM Philippine Time (UTC+8)
    - cron: '0 0 * * 0'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run price updater
        run: python update_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "floor-watch-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Weekly price update: $(date -u +'%Y-%m-%d')"
          git push
